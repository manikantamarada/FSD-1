<!DOCTYPE html>
<html>
<head>
    <title>Three Frame Page</title>
</head>

<frameset cols="30%,40%,30%">

    <frame src="image.html" name="imageFrame">

    <frame src="paragraph.html" name="paragraphFrame">

    <frame src="links.html" name="linkFrame">

    <noframes>
        <body>
            <h2>Your browser does not support frames.</h2>
            <p>Please use a modern browser to view this page.</p>
        </body>
    </noframes>

</frameset>

</html>
