<!DOCTYPE html>
<html>
<head> 
    <title>Types of CSS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h2 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 18px;
            color: green;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 style="color: red; text-align: center;">
        CSS Style Types
    </h1>

    <h2>Internal CSS Example</h2>

    <p>This paragraph is styled using Internal CSS.</p>

    <div class="external">
        This text is styled using External CSS.
    </div>

    <p style="color: purple; font-weight: bold;">
        This paragraph is styled using Inline CSS.
    </p>

</body>
</html>
