<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists(72)</title>
</head>
<body>

    <h1>HTML Lists</h1>

    <h2>1. Ordered List</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>Java</li>
    </ol>

    <h2>2. Unordered List</h2>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
    </ul>

    <h2>3. Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>

        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
    </dl>

</body>
</html>
